name: Build Android APK

# WHY THIS WORKFLOW EXISTS (the "github block" from the chat that produced this repo):
# Compiling the Android project needs the Android SDK, the Android Gradle Plugin's
# dependencies from Google's Maven repo (maven.google.com / dl.google.com), and Gradle
# itself (services.gradle.org). The sandboxed environment this repo was built in has a
# network allowlist that blocks all three domains — confirmed directly (curl returned
# 403 host_not_allowed) rather than assumed. GitHub Actions runners have none of those
# restrictions, so the actual compile step happens here instead. See README.md's
# "Building the APK" section for what you need to do to make this workflow run.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you re-run from the Actions tab without an empty commit

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      base_path: ${{ steps.pages-base.outputs.base_path }}
      host: ${{ steps.pages-base.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Determine GitHub Pages base path
        id: pages-base
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${OWNER_LOWER}.github.io" ]; then
            # User/org Pages repo — served at the domain root.
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "host=${OWNER_LOWER}.github.io" >> "$GITHUB_OUTPUT"
          else
            # Project Pages repo — served at a sub-path named after the repo.
            echo "base_path=/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "host=${OWNER_LOWER}.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.pages-base.outputs.base_path }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Bubblewrap at this runner's JDK + Android SDK
        # Bypasses Bubblewrap's interactive first-run setup wizard (it otherwise always
        # prompts to install its own JDK/SDK, even for --version). GitHub's ubuntu-latest
        # runners already have both — this just tells Bubblewrap where to find them.
        # See build-tools/generate-android-project.mjs's header comment for how this was
        # discovered (by installing @bubblewrap/cli and reading its own source, not by
        # guessing).
        run: |
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cat > ~/.bubblewrap/config.json << EOF
          {"jdkPath":"${JAVA_HOME}","androidSdkPath":"${SDK_PATH}"}
          EOF
          cat ~/.bubblewrap/config.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See README.md's" \
                 "'Building the APK' section — you need to add this secret (plus" \
                 "ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD) before this" \
                 "workflow can sign an APK. The values came from android-keystore/ in" \
                 "the work bundle this repo was generated from — do not generate a new" \
                 "keystore, or every future build becomes a different, incompatible app."
            exit 1
          fi
          mkdir -p android-keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-keystore/android.keystore

      - name: Point the TWA at this repo's real GitHub Pages URL
        env:
          REAL_HOST: ${{ needs.build-and-deploy-web.outputs.host }}
          BASE_PATH: ${{ needs.build-and-deploy-web.outputs.base_path }}
        run: |
          # Deliberately only patches the files Gradle/the compiled app actually read.
          # twa-manifest.json keeps the placeholder host on purpose — touching it would
          # invalidate manifest-checksum.txt and trigger Bubblewrap's interactive
          # "update project?" prompt, which has no way to be answered on a non-TTY CI
          # runner and would hang the job instead of failing fast.
          sed -i "s/placeholder-trajectory-pwa\.example/${REAL_HOST}/g" \
            android/app/build.gradle \
            android/app/src/main/res/values/strings.xml

          if [ "$BASE_PATH" != "/" ]; then
            # Project Pages sub-path deploy: the TWA's launch path must match, or the
            # installed app opens to a 404. launchUrl is always exactly `'/',` as
            # generated (see build-tools/generate-android-project.mjs) so this replace
            # is unambiguous.
            sed -i "s#launchUrl: '/',#launchUrl: '${BASE_PATH}',#" android/app/build.gradle
          fi

          echo "Patched TWA host to: ${REAL_HOST}, launch path: ${BASE_PATH}"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: bubblewrap build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-apk
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 90
